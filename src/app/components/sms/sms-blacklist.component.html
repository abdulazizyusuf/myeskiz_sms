<app-header></app-header>

<section class="main-content">

  <h1 class="page-title">{{'blacklist' | translate}}</h1>

  <app-sms-menu></app-sms-menu>

  <section class="white-content">
    <div class="mb-15">
      <button class="btn btn-sm btn-primary" (click)="addData()"><i class="ion-md-add"></i> {{'add' |
        translate}}</button>
      <button class="btn btn-sm btn-outline-primary ml-2" (click)="importBlacklist()"><i
          class="ion-md-cloud-upload"></i> {{'import_contacts' | translate}} (.xlsx)</button>
    </div>
    <div class="table-responsive mob-visible">
      <table class="table table-striped table-bordered table-hover">
        <thead class="thead-light">
          <tr>
            <th>{{'type' | translate}}</th>
            <th>{{'Значения' | translate}}</th>
            <th></th>
          </tr>
          <tr>
            <th colspan="3">
              @if (filter) {
              <form (ngSubmit)="search()" #dataForm="ngForm" style="width:100%;" class="input-group">
                <select name="type" class="form-control" [(ngModel)]="filter.type">
                  <option value="">{{'Все типы' | translate}}</option>
                  <option value="phone">{{'Номер телефона' | translate}}</option>
                  <option value="content">{{'Слова' | translate}}</option>
                </select>
                <input type="text" name="value" class="form-control" [(ngModel)]="filter.value"
                  placeholder="{{'Значения' | translate}} ...">
                <div class="input-group-prepend">
                  <button type="submit" [disabled]="!filter.value" class="btn btn-primary">{{'search' |
                    translate}}</button>
                  <button type="button" (click)="searchReset()" class="btn btn-warning">{{'cancel' |
                    translate}}</button>
                </div>
              </form>
              }
            </th>
          </tr>
        </thead>
        <tbody>
          @for (item of blacklists(); track item.id) {
          <tr>
            <td>
              @if (item.type == 'phone') {
              <div>{{'Номер телефона' | translate}}</div>
              }
              @if (item.type == 'content') {
              <div>{{'Запрещенная слова' | translate}}</div>
              }
            </td>
            <td>{{item.keyword}}</td>
            <td width="100">
              <button class="btn btn-sm btn-danger" type="button" (click)="deleteData(item)">{{'delete' |
                translate}}</button>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="text-center">
      <ngb-pagination class="d-flex justify-content-center" [collectionSize]="totalPage" [(page)]="currentPage"
        [maxSize]="4" [pageSize]="pageSize" [rotate]="true" (pageChange)="pageChanged($event)"></ngb-pagination>
    </div>

  </section>

</section>
