<div class="modal-header">
  <h4 class="modal-title">{{'Сотрудник' | translate}}</h4>
  <button type="button" class="close" (click)="activeModal.close()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
@if (edited) {
<div class="modal-body">
  @if (data) {
  <form class="col-lg-12" (ngSubmit)="patchData()" #dataForm="ngForm">
    <div class="form-group">
      <label>{{'status' | translate}}</label>
      <select class="form-control" [(ngModel)]="data.access" name="access" required>
        <option value="active">{{'active' | translate}}</option>
        <option value="inactive">{{'Неактивный' | translate}}</option>
      </select>
    </div>
    <div class="form-group">
      <label>{{'fullname' | translate}}</label>
      <input type="text" class="form-control" [(ngModel)]="data.name" name="name" required>
    </div>
    <div class="form-group">
      <label>{{'Номер телефона' | translate}}</label>
      <div class="input-group">
        <div class="input-group-prepend">
          <span class="input-group-text" id="basic-addon1"><img src="/assets/images/flags/{{phone_flag}}.svg" width="20"
              height="auto">
            &nbsp;+{{data.phone_ext}}</span>
        </div>
        <input type="text" class="form-control" [(ngModel)]="data.phone" name="phone" #phone="ngModel" minlength="9"
          mask="{{numberFormat}}" placeholder="9XXXXXXXX {{'mobile_number' | translate}}" required>
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="data.email" name="email" required>
    </div>
    <div class="form-group">
      <label>{{'department' | translate}}</label>
      <input type="text" class="form-control" [(ngModel)]="data.department" name="department" required>
    </div>
    <div class="mb-3">
      <div class="custom-control custom-switch">
        <input type="checkbox" class="custom-control-input" [(ngModel)]="data.detailing" name="detailing" id="detailing">
        <label class="custom-control-label" for="detailing">{{'Открыть доступ к разделу Детализация смс сообщений' | translate}}</label>
      </div>
    </div>
    <div class="form-group">
      <label>{{'password' | translate}} <a role="button" class="btn-link ml-3"
          (click)="randomPassword()">{{'Сгенерировать пароль' | translate}}</a></label>
      <input type="text" class="form-control" minlength="6" [(ngModel)]="data.password" name="password"
        [required]="!data.id">
    </div>
    <div class="form-group">
      <button type="submit" class="btn btn-success btn-r" [disabled]="!dataForm.form.valid">Сохранить</button>
      <button type="button" class="btn btn-warning" (click)="activeModal.close()">Отменить</button>
    </div>
  </form>
  }
</div>
}
@if (deleted) {
<div class="modal-body">
  <div class="alert alert-danger">
    Вы уверены, что хотите удалить <strong>{{data.date}} - {{data.company}}</strong>?
  </div>
  <div class="form-group">
    <button type="submit" class="btn btn-primary btn-r" (click)="deleteData()">Удалить</button>
    <button type="button" class="btn btn-warning" (click)="activeModal.close()">Отменить</button>
  </div>
</div>
}
